[package]
name = "zelloom"
version = "0.1.0"
edition = "2024"

[lib]
name = "zelloom"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
jiff = "0.2.37"
libc = "0.2.180"
nix = { version = "0.31.3", features = ["user", "process", "signal", "term", "poll"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "signal"] }
toml = "1.1.6"
toml_edit = "0.25.15"
ulid = "3.0.0"
unicode-width = "0.2.2"

[dev-dependencies]
serial_test = "4.0.1"
tempfile = "3.27.0"
